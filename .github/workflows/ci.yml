name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    # 应用针对 Windows 桌面场景设计，主进程路径/备份逻辑在 CI 上同样按 Windows 校验
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:coverage
